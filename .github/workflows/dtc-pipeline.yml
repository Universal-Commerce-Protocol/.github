name: DTC Review Pipeline

on:
  schedule:
    # Sync Next DTC Agenda assignees every 15 minutes
    - cron: "*/15 * * * *"
  repository_dispatch:
    types:
      - projects_v2_item
  workflow_dispatch:
    inputs:
      mode:
        description: "Command to execute (sync-agenda-assignees or scan-spotlight)"
        required: false
        type: choice
        options:
          - sync-agenda-assignees
          - scan-spotlight
        default: "sync-agenda-assignees"

permissions:
  contents: read # Check out org-tools/dtc-pipeline scripts

jobs:
  dtc-pipeline:
    name: Run DTC Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out org-tools/dtc-pipeline scripts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: "false"

      - name: Sync Next DTC Agenda assignees
        if: inputs.mode != 'scan-spotlight'
        env:
          ORG_TRIAGE_TOKEN: ${{ secrets.ORG_TRIAGE_TOKEN }}
          DTC_PROJECT_ID: ${{ vars.DTC_PROJECT_ID }}
        run: uv run --frozen python org-tools/dtc-pipeline/scripts/dtc_pipeline.py sync-agenda-assignees --apply

      - name: Run Community Spotlight scan
        if: inputs.mode == 'scan-spotlight'
        env:
          ORG_TRIAGE_TOKEN: ${{ secrets.ORG_TRIAGE_TOKEN }}
          DTC_PROJECT_ID: ${{ vars.DTC_PROJECT_ID }}
          ORG_NAME: ${{ github.repository_owner }}
        run: uv run --frozen python org-tools/dtc-pipeline/scripts/dtc_pipeline.py scan-spotlight --org "$ORG_NAME" --repo ucp --apply
