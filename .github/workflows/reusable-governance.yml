name: Reusable Governance Gate

on:
  workflow_call:
    inputs:
      rules-file:
        required: false
        type: string
        description: "Optional path to the governance rules configuration file (e.g., .github-central/org-tools/governance/rules/python-sdk-rules.yml). If not provided, resolved via --repo mapping."
      pr-number:
        required: false
        type: string
        description: "Optional PR number. Falls back to pull_request context if not provided."
      commit-sha:
        required: false
        type: string
        description: "Optional commit SHA. Falls back to pull_request context if not provided."
    secrets:
      ORG_READ_TOKEN:
        required: true
        description: "Org-level read token for team membership checks"

permissions: {}

jobs:
  evaluate:
    name: Approvals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write # Post the Governance / Approvals commit status
    steps:
      - name: Check out central governance scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: main
          path: .github-central
          token: ${{ secrets.ORG_READ_TOKEN }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: "false"

      - name: Evaluate governance approvals and post commit status
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          STATUS_TOKEN: ${{ github.token }}
          GITHUB_ORG: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_COMMIT_SHA: ${{ inputs.commit-sha }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RULES_FILE: ${{ inputs.rules-file }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 .github-central/org-tools/governance/scripts/run_governance_gate.py
