- name: status:needs-triage
  color: "FBCA04"
  description: Signal that the PR is ready for human triage

- name: status:under-review
  color: "1D76DB"

- name: status:stale-review
  color: "6F7A8A"
  description: Applied if a PR is waiting on a reviewer for too long

- name: status:blocked
  color: "D93F0B"

