# Target Repository: meeting-minutes
# Repository URL: https://github.com/Universal-Commerce-Protocol/meeting-minutes
---
rules:
  # ---------------------------------------------------------
  # Governance
  # ---------------------------------------------------------
  - name: "governance_and_licensing"
    patterns:
      - "LICENSE"
    requires:
      # Strictly Governance Council (L4)
      - team: "governance-council"
        min_approvals: 1

  # ---------------------------------------------------------
  # Technical Council Minutes - Domain Specific
  #
  # Each council owns its directory in the repo's .github/CODEOWNERS, with
  # devops-maintainers alongside as a backup approver. CODEOWNERS ignores
  # team_hierarchy, so the floor here is L1, not L3 -- otherwise a backup
  # approval would pass CODEOWNERS and fail this validator. Ownership is
  # unchanged; the backup only unblocks minutes a council cannot review.
  # ---------------------------------------------------------
  - name: "shopping_tech_council_minutes"
    patterns:
      - "tc/shopping/**"
    requires:
      # tc/shopping/ is owned by shopping-tech-council (L3) in CODEOWNERS.
      # Floor is L1 so the backup approver also satisfies this rule.
      - min_team: "devops-maintainers"
        min_approvals: 1

  - name: "food_tech_council_minutes"
    patterns:
      - "tc/food/**"
    requires:
      # tc/food/ is owned by food-tech-council (L3) in CODEOWNERS.
      # Floor is L1 so the backup approver also satisfies this rule.
      - min_team: "devops-maintainers"
        min_approvals: 1

  - name: "lodging_tech_council_minutes"
    patterns:
      - "tc/lodging/**"
    requires:
      # tc/lodging/ is owned by lodging-tech-council (L3) in CODEOWNERS.
      # Floor is L1 so the backup approver also satisfies this rule.
      - min_team: "devops-maintainers"
        min_approvals: 1

  - name: "payments_tech_council_minutes"
    patterns:
      - "tc/payments/**"
    requires:
      # tc/payments/ is owned by payments-tech-council (L3) in CODEOWNERS.
      # Floor is L1 so the backup approver also satisfies this rule.
      - min_team: "devops-maintainers"
        min_approvals: 1

  # ---------------------------------------------------------
  # Governing Council Minutes
  # ---------------------------------------------------------
  - name: "governance_council_minutes"
    patterns:
      - "gc/**"
    requires:
      # Grants access to governance-council (L4)
      - min_team: "governance-council"
        min_approvals: 1

  # ---------------------------------------------------------
  # Infrastructure, Tooling, General Files & Shared Templates
  # ---------------------------------------------------------
  - name: "infra_and_tooling"
    patterns:
      - ".codespellignore"
      - ".github/**"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "tc/*.md"
    requires:
      # Grants access to devops (L1), maintainers (L2), tech councils (L3),
      # and governance-council (L4)
      - min_team: "devops-maintainers"
        min_approvals: 1

fallback:
  requires:
    # Default for all files (*).
    # Strictest rule possible
    - min_team: "governance-council"
      min_approvals: 1

proxy_reviewers:
  - amithanda

team_hierarchy:
  devops-maintainers: 1
  maintainers: 2
  tech-council: 3
  shopping-tech-council: 3
  food-tech-council: 3
  lodging-tech-council: 3
  payments-tech-council: 3
  governance-council: 4
