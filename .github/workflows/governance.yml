---
name: PR Governance

# pull_request_target is required so the validator can read team memberships via
# ORG_READ_TOKEN on PRs from forks and post the Governance / Approvals commit
# status, while workflow_run re-evaluates when a review is submitted. No
# PR-authored code is checked out or executed.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches:
      - main
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - review_requested
      - review_request_removed
      - assigned
      - unassigned
  workflow_run:
    workflows: ["PR Review Listener"]
    types: [completed]

permissions: {}

jobs:
  governance:
    name: Reviews
    permissions:
      statuses: write # Post the Governance / Approvals commit status
    uses: ./.github/workflows/reusable-governance.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      commit-sha: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    secrets:
      # Required: An org-level Read token to read team memberships
      ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
